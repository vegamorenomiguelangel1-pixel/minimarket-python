{% extends "base.html" %}
{% block titulo %}Confirmar eliminación - Minimarket{% endblock %}
{% block encabezado %}Eliminar {{ tipo }}{% endblock %}

{% block contenido %}
<section class="panel">
    <p>¿Seguro que desea eliminar <strong>{{ nombre }}</strong>?</p>
    <form method="post" class="acciones">
        <button type="submit" class="peligro">Sí, eliminar</button>
        <a class="boton-secundario" href="{{ cancelar }}">Cancelar</a>
    </form>
</section>
{% endblock %}
